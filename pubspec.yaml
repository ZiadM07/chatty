name: Chatty
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  solar_icons: ^0.0.5
  injectable: ^2.6.0
  shared_preferences: ^2.5.3
  auto_route: ^10.2.2
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^9.0.5
  device_info_plus: ^12.2.0
  dio: ^5.9.0
  internet_connection_checker_plus: ^2.9.1
  location: ^8.0.1
  permission_handler: ^12.0.1
  file_picker: ^10.3.6
  image_picker: ^1.2.1
  package_info_plus: ^9.0.0
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  http: ^1.6.0
  onesignal_flutter: ^5.3.4
  flash: ^3.1.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  bouncing_widget: ^2.0.0
  intl: ^0.20.2
  responsive_framework: ^1.5.1
  shimmer: ^3.0.0
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  lottie: ^3.3.2
  url_launcher: ^6.3.2
  pinput: ^6.0.0
  flutter_svg: ^2.2.2
  auto_size_text: ^3.0.0
  injectable_generator: ^2.7.0
  auto_route_generator: ^10.1.0
  build_runner: ^2.10.4
  firebase_core: ^4.2.1
  flutter_native_splash: ^2.4.7
  firebase_app_check: ^0.4.1+2
  json_annotation: ^4.9.0
  rxdart: ^0.28.0
  record: ^6.1.1
  audioplayers: ^6.5.1
  supabase_flutter: ^2.10.3
  mime: ^1.0.3
  path: ^1.8.3
  video_player: ^2.10.1
  fcm_config: ^3.6.5
  image_cropper: ^11.0.0
  palette_generator: ^0.3.3+7
  uuid: ^4.5.1
  flutter_launcher_icons: ^0.14.4
  emoji_picker_flutter: ^4.4.0
  photo_view: ^0.15.0
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/pngs/logo.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/pngs/
    - assets/jsons/
    - assets/svgs/
    - assets/fonts/Cairo/Cairo-Regular.ttf
    - assets/fonts/Cairo/Cairo-Bold.ttf
    - assets/fonts/inter/Inter-Regular.ttf
    - assets/fonts/inter/Inter-Bold.ttf
    - assets/fonts/emoji/NotoColorEmoji-Regular.ttf
    - assets/sounds/message.mp3

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/Cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo/Cairo-ExtraLight.ttf
          weight: 100

    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Black.ttf
          weight: 900
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 100

    - family: PlayfairDisplaySC
      fonts:
        - asset: assets/fonts/PlayfairDisplaySc/PlayfairDisplaySC-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplaySc/PlayfairDisplaySC-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplaySc/PlayfairDisplaySC-Black.ttf
          weight: 900

    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/emoji/NotoColorEmoji-Regular.ttf
          weight: 400